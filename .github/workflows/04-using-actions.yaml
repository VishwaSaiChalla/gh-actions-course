name: 04 - Using Actions
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v7
              with: 
                node-version: 24
                package-manager-cache: false
            - name: Install Dependencies
              working-directory: 04-using-actions/react-app
              run: npm ci
            - name: Run Unit Tests
              working-directory: 04-using-actions/react-app
              run: npm run test
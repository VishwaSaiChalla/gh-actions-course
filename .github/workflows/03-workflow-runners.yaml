name: 03 - Workflow Runners
on:
    workflow_dispatch:
        inputs:
            runner-type:
                description: 'Select the type of runner to use'
                required: true
                default: 'ubuntu'
                type: choice
                options:
                    - ubuntu
                    - windows
                    - macos

jobs:
    ubuntu-echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show OS
              run: |
                echo "This job is running on an Ubuntu runner."
                echo "Operating System: $(uname -a)"
    
    windows-echo:
        runs-on: windows-latest
        steps:
            - name: Show OS
              run: |
                echo "This job is running on a Windows runner."
                echo "Operating System: $env:OS"
    
    mac-echo:
        runs-on: macos-latest
        steps:
            - name: Show OS
              run: |
                echo "This job is running on a macOS runner."
                echo "Operating System: $(sw_vers)"